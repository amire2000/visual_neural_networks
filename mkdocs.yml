site_name: Visual Neural Networks
site_description: A visual, beginner-friendly guide to neural networks and modern computer vision
theme:
  name: material
  icon:
    logo: material/brain
  favicon: assets/vision-mark.svg
  features:
    - content.code.copy
extra_javascript:
  - javascripts/quiz.js
  - javascripts/convolution-demo.js
  - javascripts/grid-transform-demo.js
  - javascripts/mermaid.mjs
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/quiz.css
  - stylesheets/convolution-demo.css
  - stylesheets/mermaid.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Syllabus: syllabus.md
  - Vocabulary: vocabulary.md
  - 0 - Setup Lab: lesson-00-setup-lab/index.md
  - Stage 1:
      - 1 - How Neural Networks See Images: modules/01-cnn-fundamentals/lesson-01-how-neural-networks-see-images/index.md
      - 2 - How Filters Learn Patterns: modules/01-cnn-fundamentals/lesson-02-how-cnn-filters-learn-patterns/index.md
      - 3 - CNN Layer Transformations: modules/01-cnn-fundamentals/lesson-03-how-cnn-layers-transform-images/index.md
      - 4 - Build a CNN in PyTorch: modules/01-cnn-fundamentals/lesson-04-build-first-cnn-pytorch/index.md
      - 5 - What CNNs Learn: modules/01-cnn-fundamentals/lesson-05-what-cnn-learns/index.md
      - 6 - Training and Overfitting: modules/01-cnn-fundamentals/lesson-06-training-overfitting-improve-accuracy/index.md
      - 6.1 - TensorBoard (optional): modules/01-cnn-fundamentals/lesson-06-1-tensorboard-dashboard/index.md
  - Stage 2:
      - 7 - From MNIST to CIFAR-10: modules/02-modern-cnns/lesson-07-from-mnist-to-cifar10/index.md
      - 8 - Building Deeper CNNs: modules/02-modern-cnns/lesson-08-building-deeper-cnns/index.md
      - 9 - Understanding ResNet: modules/02-modern-cnns/lesson-09-understanding-resnet/index.md
      - 10 - Transfer Learning: modules/02-modern-cnns/lesson-10-transfer-learning/index.md
  - Stage 3:
      - 11 - Vision Transformers: modules/03-modern-computer-vision/lesson-11-vision-transformers/index.md
      - 12 - Self-Supervised Learning: modules/03-modern-computer-vision/lesson-12-self-supervised-learning/index.md
      - 13 - Object Detection: modules/03-modern-computer-vision/lesson-13-object-detection/index.md
  - Stage 4:
      - 14 - Model Optimization: modules/04-practical-computer-vision/lesson-14-model-optimization/index.md
      - 15 - Real-Time Computer Vision: modules/04-practical-computer-vision/lesson-15-real-time-computer-vision/index.md
  - Capstone - German Traffic Signs: capstone-gtsrb/index.md
