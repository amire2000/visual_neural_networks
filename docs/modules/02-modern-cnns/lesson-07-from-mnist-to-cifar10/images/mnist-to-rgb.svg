<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">From one grayscale image plane to three color channels</title>
  <desc id="desc">A grayscale digit represented by one matrix is compared with an RGB photo represented by red, green, and blue matrices stacked into a three-channel tensor.</desc>
  <rect width="1000" height="310" rx="20" fill="#f8fafc"/>
  <text x="250" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172554">MNIST · grayscale</text>
  <text x="750" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172554">CIFAR-10 · RGB color</text>
  <rect x="70" y="70" width="360" height="190" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="570" y="70" width="360" height="190" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <g transform="translate(110 105)">
    <rect width="120" height="120" fill="#111827"/>
    <path d="M25 30h72M70 30v20M62 50 52 65 42 80 32 95" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <text x="160" y="48" font-family="Arial,sans-serif" font-size="18" fill="#334155">One brightness value</text>
    <text x="160" y="76" font-family="Arial,sans-serif" font-size="18" fill="#334155">per pixel</text>
    <text x="160" y="112" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">[1, 28, 28]</text>
  </g>
  <g transform="translate(605 105) skewY(-8)">
    <rect x="22" y="16" width="112" height="112" fill="#ef4444" opacity=".82" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="12" y="8" width="112" height="112" fill="#22c55e" opacity=".78" stroke="#14532d" stroke-width="2"/>
    <rect width="112" height="112" fill="#3b82f6" opacity=".78" stroke="#1e3a8a" stroke-width="2"/>
    <text x="160" y="38" font-family="Arial,sans-serif" font-size="17" fill="#334155">Red · Green · Blue</text>
    <text x="160" y="70" font-family="Arial,sans-serif" font-size="17" fill="#334155">three values per pixel</text>
    <text x="160" y="106" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172554">[3, 32, 32]</text>
  </g>
  <text x="500" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">PyTorch orders image dimensions as [channels, height, width]</text>
</svg>
