<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Animated transfer learning workflow</title>
  <desc id="desc">A pretrained image feature extractor feeds a new ten-class head. First train only the head, then optionally unfreeze later feature blocks.</desc>
  <style>
    text { font: 17px sans-serif; fill: #18324f; }
    .small { font-size: 14px; fill: #425b75; }
    .frozen { fill: #e5effa; stroke: #376b9e; stroke-width: 2; }
    .new { fill: #fff0df; stroke: #d47b22; stroke-width: 2; }
    .flow { fill: none; stroke: #56728d; stroke-width: 4; stroke-dasharray: 9 9; animation: flow 1.4s linear infinite; }
    .head { transform-box: fill-box; transform-origin: center; animation: learn 1.8s ease-in-out infinite; }
    .unfreeze { fill: none; stroke: #e07a28; stroke-width: 4; stroke-dasharray: 8 8; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes learn { 50% { transform: scale(1.06); fill: #ffe0bd; } }
    @media (prefers-reduced-motion: reduce) { .flow, .head, .unfreeze { animation: none; } }
  </style>
  <rect width="960" height="340" rx="18" fill="#fff"/>
  <text x="480" y="36" text-anchor="middle" font-weight="700">Adapt a pretrained model to a park-camera task</text>
  <rect x="35" y="118" width="142" height="88" rx="14" fill="#edf4e9" stroke="#54745b" stroke-width="2"/>
  <text x="106" y="153" text-anchor="middle">CIFAR-like</text><text x="106" y="180" text-anchor="middle">camera image</text>
  <path class="flow" d="M178 162H235"/>
  <g><rect class="frozen" x="240" y="100" width="250" height="124" rx="14"/><text x="365" y="136" text-anchor="middle" font-weight="700">Pretrained features</text><text class="small" x="365" y="168" text-anchor="middle">edges → textures → shapes</text><text class="small" x="365" y="195" text-anchor="middle">freeze at first</text></g>
  <path class="flow" d="M492 162H545"/>
  <g class="head"><rect class="new" x="550" y="118" width="170" height="88" rx="14"/><text x="635" y="153" text-anchor="middle" font-weight="700">New 10-class</text><text class="small" x="635" y="180" text-anchor="middle">classification head</text></g>
  <path class="flow" d="M722 162H775"/>
  <rect x="780" y="118" width="145" height="88" rx="14" fill="#e6f4ef" stroke="#238b70" stroke-width="2"/>
  <text x="852" y="153" text-anchor="middle">Class scores</text><text class="small" x="852" y="180" text-anchor="middle">airplane … truck</text>
  <path class="unfreeze" d="M265 264H485"/>
  <text class="small" x="375" y="292" text-anchor="middle">Optional: unfreeze later feature blocks for fine-tuning</text>
  <text class="small" x="735" y="292" text-anchor="middle">Validate on held-out task images</text>
</svg>
