<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="245" viewBox="0 0 1100 245" role="img" aria-labelledby="title desc">
  <title id="title">Vision in Practice stage recap</title>
  <desc id="desc">A real-time vision system preprocesses a camera frame, runs inference, postprocesses the result, and returns it to an application, with latency and throughput measured end to end.</desc>
  <rect width="1100" height="245" rx="18" fill="#f8fafc"/><style>text{font:17px Arial,sans-serif;fill:#172554}.label{font-weight:700}.box{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:14}.arrow{stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <text x="550" y="38" text-anchor="middle" font-size="23" font-weight="700">Measure the whole real-time vision path</text>
  <rect class="box" x="30" y="85" width="180" height="92"/><text class="label" x="120" y="123" text-anchor="middle">Camera</text><text x="120" y="151" text-anchor="middle">frame</text>
  <path class="arrow" d="M215 131H260"/>
  <rect class="box" x="270" y="85" width="190" height="92"/><text class="label" x="365" y="123" text-anchor="middle">Preprocess</text><text x="365" y="151" text-anchor="middle">resize + normalize</text>
  <path class="arrow" d="M465 131H510"/>
  <rect class="box" x="520" y="85" width="180" height="92"/><text class="label" x="610" y="123" text-anchor="middle">Inference</text><text x="610" y="151" text-anchor="middle">FP32 / FP16 / INT8</text>
  <path class="arrow" d="M705 131H750"/>
  <rect class="box" x="760" y="85" width="180" height="92"/><text class="label" x="850" y="123" text-anchor="middle">Postprocess</text><text x="850" y="151" text-anchor="middle">format result</text>
  <path class="arrow" d="M945 131H990"/><text class="label" x="1045" y="127" text-anchor="middle">Action</text><text x="1045" y="151" text-anchor="middle">on time?</text>
  <path d="M50 205H1050" stroke="#0f766e" stroke-width="4"/><path d="M50 197V213M1050 197V213" stroke="#0f766e" stroke-width="4"/><text x="550" y="233" text-anchor="middle" fill="#0f766e">Measure end-to-end latency and throughput across every step</text>
</svg>
