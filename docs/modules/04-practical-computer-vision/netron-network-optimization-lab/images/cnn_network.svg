<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">CNN network architecture</title>
<desc id="desc">Input image tensor flows through a stride two stem convolution, a target convolution, global average pooling, flattening and a linear layer to ten outputs.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#294563" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627a96"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#182b43}
    .title{font-size:25px;font-weight:700;letter-spacing:.2px}.subtitle{font-size:13px;fill:#63758b}
    .stage{font-size:15px;font-weight:700}.detail{font-size:12px;fill:#526780}.shape{font-size:14px;font-weight:650;fill:#263e5c}.small{font-size:11px;fill:#71839a}
    .card{fill:#fff;stroke:#dce6f0;stroke-width:1.2;filter:url(#shadow)}
    .arrow{stroke:#7187a0;stroke-width:2;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1120" height="430" rx="22" fill="url(#bg)"/>
<text x="48" y="54" class="title">CNN architecture</text>
<text x="48" y="78" class="subtitle">Image input → spatial feature extraction → 10-class output</text>

<!-- connector path -->
<path class="arrow" d="M198 221H232"/><path class="arrow" d="M405 221H439"/><path class="arrow" d="M614 221H648"/><path class="arrow" d="M817 221H851"/>

<!-- Input -->
<g transform="translate(40 130)">
 <rect class="card" width="158" height="182" rx="16"/>
 <rect x="18" y="20" width="122" height="76" rx="9" fill="#e6f2ff" stroke="#bfd8ef"/>
 <rect x="29" y="31" width="100" height="54" rx="5" fill="#d2e8fb"/>
 <path d="M35 76l25-24 18 16 16-18 28 26" fill="none" stroke="#4c91cb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="105" cy="43" r="7" fill="#f3c867"/>
 <text x="79" y="124" text-anchor="middle" class="stage">Input</text>
 <text x="79" y="151" text-anchor="middle" class="shape">[1, 3, 224, 224]</text>
 <text x="79" y="170" text-anchor="middle" class="small">RGB image</text>
</g>

<!-- Stem -->
<g transform="translate(232 130)">
 <rect class="card" width="173" height="182" rx="16"/>
 <rect x="18" y="20" width="137" height="76" rx="10" fill="#eef6ff"/>
 <g fill="#65a5d8"><rect x="42" y="34" width="26" height="20" rx="4"/><rect x="74" y="34" width="26" height="20" rx="4"/><rect x="106" y="34" width="26" height="20" rx="4"/><rect x="42" y="60" width="26" height="20" rx="4"/><rect x="74" y="60" width="26" height="20" rx="4"/><rect x="106" y="60" width="26" height="20" rx="4"/></g>
 <text x="86" y="120" text-anchor="middle" class="stage">Stem Conv</text>
 <text x="86" y="141" text-anchor="middle" class="detail">3×3 · stride 2</text>
 <text x="86" y="165" text-anchor="middle" class="shape">[1, 32, 112, 112]</text>
</g>

<!-- target -->
<g transform="translate(439 130)">
 <rect class="card" width="175" height="182" rx="16"/>
 <rect x="18" y="20" width="139" height="76" rx="10" fill="#eff9f5"/>
 <g fill="#56b88c"><rect x="40" y="32" width="22" height="18" rx="4"/><rect x="67" y="32" width="22" height="18" rx="4"/><rect x="94" y="32" width="22" height="18" rx="4"/><rect x="121" y="32" width="22" height="18" rx="4"/><rect x="40" y="56" width="22" height="18" rx="4"/><rect x="67" y="56" width="22" height="18" rx="4"/><rect x="94" y="56" width="22" height="18" rx="4"/><rect x="121" y="56" width="22" height="18" rx="4"/></g>
 <text x="87" y="120" text-anchor="middle" class="stage">Target Conv</text>
 <text x="87" y="141" text-anchor="middle" class="detail">3×3 · 32 → 64 channels</text>
 <text x="87" y="165" text-anchor="middle" class="shape">[1, 64, 112, 112]</text>
</g>

<!-- GAP -->
<g transform="translate(648 130)">
 <rect class="card" width="169" height="182" rx="16"/>
 <rect x="18" y="20" width="133" height="76" rx="10" fill="#fff7e9"/>
 <g fill="#e8aa45"><rect x="39" y="34" width="20" height="18" rx="4"/><rect x="63" y="34" width="20" height="18" rx="4"/><rect x="87" y="34" width="20" height="18" rx="4"/><rect x="111" y="34" width="20" height="18" rx="4"/><rect x="39" y="58" width="20" height="18" rx="4"/><rect x="63" y="58" width="20" height="18" rx="4"/><rect x="87" y="58" width="20" height="18" rx="4"/><rect x="111" y="58" width="20" height="18" rx="4"/></g>
 <path d="M85 78v8" stroke="#9d6d1e" stroke-width="2" marker-end="url(#arrow)"/>
 <text x="84" y="120" text-anchor="middle" class="stage">Global Avg Pool</text>
 <text x="84" y="142" text-anchor="middle" class="detail">spatial map → vector</text>
 <text x="84" y="165" text-anchor="middle" class="shape">[1, 64]</text>
</g>

<!-- Linear output -->
<g transform="translate(851 130)">
 <rect class="card" width="229" height="182" rx="16"/>
 <rect x="18" y="20" width="193" height="76" rx="10" fill="#f6f0ff"/>
 <g stroke="#a583cf" stroke-width="1.6" opacity=".9">
  <path d="M46 38L95 34M46 38L95 52M46 38L95 70M46 56L95 34M46 56L95 52M46 56L95 70M46 74L95 34M46 74L95 52M46 74L95 70"/>
  <path d="M111 34L160 38M111 34L160 56M111 34L160 74M111 52L160 38M111 52L160 56M111 52L160 74M111 70L160 38M111 70L160 56M111 70L160 74"/>
 </g>
 <g fill="#8f69c2"><circle cx="46" cy="38" r="4"/><circle cx="46" cy="56" r="4"/><circle cx="46" cy="74" r="4"/><circle cx="95" cy="34" r="4"/><circle cx="95" cy="52" r="4"/><circle cx="95" cy="70" r="4"/><circle cx="111" cy="34" r="4"/><circle cx="111" cy="52" r="4"/><circle cx="111" cy="70" r="4"/><circle cx="160" cy="38" r="4"/><circle cx="160" cy="56" r="4"/><circle cx="160" cy="74" r="4"/></g>
 <text x="114" y="120" text-anchor="middle" class="stage">Flatten → Linear</text>
 <text x="114" y="142" text-anchor="middle" class="detail">64 features → 10 logits</text>
 <text x="114" y="165" text-anchor="middle" class="shape">Output [1, 10]</text>
</g>
<text x="560" y="374" text-anchor="middle" class="small">Batch dimension = 1 throughout</text>
<text x="560" y="397" text-anchor="middle" class="small">Assumes the target convolution preserves the 112 × 112 spatial size.</text>
</svg>
