<rect x="110" y="120" width="250" height="250" rx="5" fill="#f0b66f"/>
<rect x="710" y="120" width="250" height="250" rx="5" fill="#b1dfcf"/>
</g>
<g stroke="#fff" stroke-width="2">
<path d="M160 120V370 M210 120V370 M260 120V370 M310 120V370 M110 170H360 M110 220H360 M110 270H360 M110 320H360"/>
<path d="M760 120V370 M810 120V370 M860 120V370 M910 120V370 M710 170H960 M710 220H960 M710 270H960 M710 320H960"/>
