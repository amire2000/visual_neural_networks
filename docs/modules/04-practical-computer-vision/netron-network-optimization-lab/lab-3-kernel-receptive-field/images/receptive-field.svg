<rect width="1100" height="500" fill="#f7fafc"/><text x="550" y="43" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d" text-anchor="middle">Why two 3×3 convolutions see a 5×5 region</text>
<text x="235" y="96" font-family="Arial" font-size="22" font-weight="bold" fill="#17324d" text-anchor="middle">Single 5×5 kernel</text><text x="835" y="96" font-family="Arial" font-size="22" font-weight="bold" fill="#17324d" text-anchor="middle">Two stacked 3×3 kernels</text>
