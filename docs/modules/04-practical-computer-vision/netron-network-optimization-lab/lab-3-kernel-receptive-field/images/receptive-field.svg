<text x="235" y="409" text-anchor="middle" font-family="Arial" font-size="18">One output depends on 25 input positions</text><text x="835" y="409" text-anchor="middle" font-family="Arial" font-size="18">Each 3×3 extends radius by one pixel</text>
<text x="550" y="466" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#17324d">Effective receptive field: 1 + (3−1) + (3−1) = 5</text></svg>
