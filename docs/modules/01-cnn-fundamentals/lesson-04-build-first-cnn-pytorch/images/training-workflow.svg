<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Training and evaluation workflow for the MNIST CNN</title>
  <desc id="desc">Training batches go through the CNN to produce logits. Cross entropy compares logits with labels, backpropagation calculates gradients, and Adam updates the weights for the next batch. Separately, test images pass through the model in evaluation mode without gradients and produce an accuracy measurement.</desc>
  <defs><marker id="workflow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="470" rx="18" fill="#f8fafc"/>
  <text x="600" y="40" fill="#172554" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Training changes weights. Evaluation measures them.</text>
  <text x="35" y="100" fill="#1d4ed8" font-family="Arial,sans-serif" font-size="17" font-weight="700">TRAIN</text>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="50" y="120" width="175" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="137" y="158" fill="#1e3a8a" font-size="17" font-weight="700">Image batch</text><text x="137" y="185" fill="#334155" font-size="15">+ correct labels</text>
    <rect x="285" y="120" width="175" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="372" y="158" fill="#5b21b6" font-size="17" font-weight="700">CNN</text><text x="372" y="185" fill="#334155" font-size="15">current weights</text>
    <rect x="520" y="120" width="145" height="100" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="592" y="158" fill="#3730a3" font-size="17" font-weight="700">Logits</text><text x="592" y="185" fill="#334155" font-size="15">10 scores/image</text>
    <rect x="725" y="120" width="165" height="100" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="807" y="158" fill="#9a3412" font-size="17" font-weight="700">Cross entropy</text><text x="807" y="185" fill="#334155" font-size="15">calculate loss</text>
    <rect x="950" y="120" width="190" height="100" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="1045" y="158" fill="#9d174d" font-size="17" font-weight="700">Backpropagation</text><text x="1045" y="185" fill="#334155" font-size="15">calculate gradients</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)"><path d="M225 170H275M460 170H510M665 170H715M890 170H940"/></g>
  <rect x="790" y="270" width="230" height="80" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="905" y="304" fill="#166534" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Adam optimizer</text>
  <text x="905" y="330" fill="#334155" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">update model weights</text>
  <path d="M1045 220V250H905V260" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#workflow-arrow)"/>
  <path d="M790 310H365V235" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#workflow-arrow)"/>
  <text x="555" y="298" fill="#475569" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">next batch uses updated weights</text>

  <path d="M35 378H1165" stroke="#cbd5e1" stroke-width="2"/>
  <text x="35" y="418" fill="#047857" font-family="Arial,sans-serif" font-size="17" font-weight="700">TEST</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="145" y="390" width="205" height="58" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="247" y="425" fill="#065f46" font-size="16" font-weight="700">Unseen test images</text>
    <rect x="440" y="390" width="250" height="58" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="565" y="425" fill="#065f46" font-size="16" font-weight="700">model.eval() + no_grad()</text>
    <rect x="780" y="390" width="170" height="58" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="865" y="425" fill="#065f46" font-size="16" font-weight="700">Predictions</text>
    <rect x="1025" y="390" width="140" height="58" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="1095" y="425" fill="#065f46" font-size="16" font-weight="700">Accuracy</text>
  </g>
  <g stroke="#059669" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)"><path d="M350 419H430M690 419H770M950 419H1015"/></g>
</svg>
