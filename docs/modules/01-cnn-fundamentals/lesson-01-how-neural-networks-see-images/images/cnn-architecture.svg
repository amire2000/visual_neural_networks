<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc">
  <title id="title">Visual path through a small CNN for MNIST</title>
  <desc id="desc">A handwritten digit image becomes learned feature maps through two convolution and ReLU stages, is reduced by max pooling, flattened into a vector, and passed to a classifier that scores digits zero through nine. The drawings are illustrative and not to scale.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1600" height="590" rx="20" fill="#f8fafc"/>
  <text x="800" y="48" fill="#172554" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">From pixels to a digit prediction</text>
  <text x="800" y="78" fill="#475569" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Each stage transforms the image into features that help distinguish the ten digits</text>

  <!-- Input image -->
  <text x="105" y="142" fill="#1e293b" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">MNIST image</text>
  <rect x="45" y="165" width="120" height="120" rx="4" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <path d="M75 205Q82 177 112 187Q140 198 113 221L79 252H134" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="105" y="317" fill="#334155" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">1 × 28 × 28</text>
  <text x="105" y="341" fill="#64748b" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">one grayscale image</text>

  <!-- Convolution 1 feature maps -->
  <text x="305" y="142" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Convolution</text>
  <text x="305" y="163" fill="#475569" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">16 learned filters</text>
  <g stroke="#334155" stroke-width="1.5">
    <rect x="278" y="205" width="100" height="100" fill="#c7d2fe"/><rect x="268" y="215" width="100" height="100" fill="#dbeafe"/><rect x="258" y="225" width="100" height="100" fill="#bfdbfe"/><rect x="248" y="235" width="100" height="100" fill="#dbeafe"/>
  </g>
  <g fill="none" stroke="#93c5fd" stroke-width="2"><path d="M262 270h72M262 289h72M280 246v72M301 246v72"/></g>
  <text x="298" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">feature maps</text>
  <text x="298" y="382" fill="#64748b" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">local patterns</text>

  <!-- ReLU -->
  <path d="M170 255H228" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="225" y="420" width="150" height="44" rx="22" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="300" y="447" fill="#5b21b6" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">ReLU: negatives → 0</text>

  <!-- Pool 1 -->
  <path d="M375 255H421" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="467" y="142" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Max pool</text>
  <text x="467" y="163" fill="#475569" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">2 × 2 window</text>
  <g stroke="#334155" stroke-width="1.5"><rect x="458" y="226" width="76" height="76" fill="#c7d2fe"/><rect x="450" y="234" width="76" height="76" fill="#dbeafe"/><rect x="442" y="242" width="76" height="76" fill="#bfdbfe"/><rect x="434" y="250" width="76" height="76" fill="#dbeafe"/></g>
  <text x="472" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">smaller maps</text>
  <text x="472" y="382" fill="#64748b" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">keep strongest response</text>

  <!-- Convolution 2 -->
  <path d="M520 255H565" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="650" y="142" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Convolution</text>
  <text x="650" y="163" fill="#475569" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">32 learned filters</text>
  <g stroke="#334155" stroke-width="1.5"><rect x="619" y="218" width="88" height="88" fill="#a5b4fc"/><rect x="610" y="227" width="88" height="88" fill="#bfdbfe"/><rect x="601" y="236" width="88" height="88" fill="#c7d2fe"/><rect x="592" y="245" width="88" height="88" fill="#dbeafe"/></g>
  <g fill="none" stroke="#818cf8" stroke-width="2"><path d="M606 275h65M606 293h65M623 251v64M643 251v64"/></g>
  <text x="641" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">richer patterns</text>
  <text x="641" y="382" fill="#64748b" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">combine earlier features</text>
  <rect x="579" y="420" width="150" height="44" rx="22" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="654" y="447" fill="#5b21b6" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">ReLU: negatives → 0</text>

  <!-- Pool 2 -->
  <path d="M709 255H754" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="799" y="142" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Max pool</text>
  <text x="799" y="163" fill="#475569" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">smaller again</text>
  <g stroke="#334155" stroke-width="1.5"><rect x="800" y="240" width="60" height="60" fill="#a5b4fc"/><rect x="792" y="248" width="60" height="60" fill="#bfdbfe"/><rect x="784" y="256" width="60" height="60" fill="#c7d2fe"/><rect x="776" y="264" width="60" height="60" fill="#dbeafe"/></g>
  <text x="812" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">compact maps</text>
  <text x="812" y="382" fill="#64748b" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">less spatial detail</text>

  <!-- Flatten -->
  <path d="M864 255H908" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="955" y="142" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Flatten</text>
  <text x="955" y="163" fill="#475569" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">maps → one vector</text>
  <g fill="#818cf8" stroke="#4338ca" stroke-width="1"><rect x="934" y="210" width="42" height="18" rx="3"/><rect x="934" y="234" width="42" height="18" rx="3"/><rect x="934" y="258" width="42" height="18" rx="3"/><rect x="934" y="282" width="42" height="18" rx="3"/><rect x="934" y="306" width="42" height="18" rx="3"/></g>
  <text x="955" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">ordered values</text>
  <text x="955" y="382" fill="#64748b" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">ready for classifier</text>

  <!-- Fully connected hidden layer -->
  <path d="M980 255H1035" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1095" y="142" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Dense layer</text>
  <text x="1095" y="163" fill="#475569" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">combine features</text>
  <g stroke="#94a3b8" stroke-width="1" opacity=".65">
    <path d="M977 219L1080 205M977 219L1080 245M977 219L1080 285M977 219L1080 325M977 219L1080 365M977 255L1080 205M977 255L1080 245M977 255L1080 285M977 255L1080 325M977 255L1080 365M977 291L1080 205M977 291L1080 245M977 291L1080 285M977 291L1080 325M977 291L1080 365M977 327L1080 205M977 327L1080 245M977 327L1080 285M977 327L1080 325M977 327L1080 365"/>
  </g>
  <g fill="#a7f3d0" stroke="#059669" stroke-width="2"><circle cx="1080" cy="205" r="13"/><circle cx="1080" cy="245" r="13"/><circle cx="1080" cy="285" r="13"/><circle cx="1080" cy="325" r="13"/><circle cx="1080" cy="365" r="13"/></g>
  <text x="1080" y="410" fill="#64748b" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">learned units</text>

  <!-- Class scores -->
  <path d="M1094 285H1193" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1315" y="142" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">10 class scores</text>
  <text x="1315" y="163" fill="#475569" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">one for each digit</text>
  <g stroke="#94a3b8" stroke-width="1" opacity=".5">
    <path d="M1093 205L1260 190M1093 205L1260 235M1093 205L1260 280M1093 205L1260 325M1093 205L1260 370M1093 285L1260 190M1093 285L1260 235M1093 285L1260 280M1093 285L1260 325M1093 285L1260 370M1093 365L1260 190M1093 365L1260 235M1093 365L1260 280M1093 365L1260 325M1093 365L1260 370"/>
  </g>
  <g fill="#fecaca" stroke="#dc2626" stroke-width="2"><circle cx="1260" cy="190" r="15"/><circle cx="1260" cy="235" r="15"/><circle cx="1260" cy="280" r="15"/><circle cx="1260" cy="325" r="15"/><circle cx="1260" cy="370" r="15"/></g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="15" font-weight="700"><text x="1290" y="195">0</text><text x="1290" y="240">1</text><text x="1290" y="285">2</text><text x="1290" y="330">⋮</text><text x="1290" y="375">9</text></g>
  <text x="1260" y="418" fill="#64748b" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">highest score = prediction</text>

  <rect x="210" y="500" width="1180" height="48" rx="12" fill="#e0f2fe"/>
  <text x="800" y="530" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Conceptual illustration, not to scale. Exact feature-map sizes depend on kernel, padding, and stride choices.</text>
</svg>
