<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
  <title id="title">Worked 2 by 2 max-pooling example</title>
  <desc id="desc">A 4 by 4 input is split into four colored 2 by 2 windows. Each window sends its largest value to the corresponding cell of a 2 by 2 output: 6, 2, 5, and 9.</desc>
  <defs>
    <marker id="pool-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#64748b"/></marker>
  </defs>
  <rect width="920" height="410" rx="18" fill="#f8fafc"/>
  <text x="240" y="44" fill="#172554" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Input feature map</text>
  <text x="240" y="70" fill="#475569" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">4 × 4 values, divided into four 2 × 2 windows</text>
  <text x="725" y="44" fill="#172554" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Pooled output</text>
  <text x="725" y="70" fill="#475569" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">one maximum from each window</text>

  <g fill="none" stroke-width="3" opacity=".8" marker-end="url(#pool-arrow)">
    <path d="M170 160C340 100 500 115 650 185" stroke="#2563eb"/>
    <path d="M230 160C410 115 550 135 730 185" stroke="#d97706"/>
    <path d="M170 280C350 330 500 295 650 265" stroke="#059669"/>
    <path d="M230 280C430 325 555 280 730 265" stroke="#9333ea"/>
  </g>

  <!-- Each background color marks one non-overlapping 2 by 2 window. -->
  <rect x="80" y="100" width="120" height="120" fill="#dbeafe"/>
  <rect x="200" y="100" width="120" height="120" fill="#ffedd5"/>
  <rect x="80" y="220" width="120" height="120" fill="#d1fae5"/>
  <rect x="200" y="220" width="120" height="120" fill="#f3e8ff"/>
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <path d="M80 100H320V340H80Z"/><path d="M140 100V340M200 100V340M260 100V340M80 160H320M80 220H320M80 280H320"/>
    <path d="M200 100V340M80 220H320" stroke-width="3"/>
  </g>
  <g fill="#1e293b" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">
    <text x="110" y="140">1</text><text x="170" y="140">3</text><text x="230" y="140">2</text><text x="290" y="140">0</text>
    <text x="110" y="200">4</text><text x="170" y="200" font-weight="700">6</text><text x="230" y="200">1</text><text x="290" y="200">2</text>
    <text x="110" y="260" font-weight="700">5</text><text x="170" y="260">2</text><text x="230" y="260">7</text><text x="290" y="260">8</text>
    <text x="110" y="320">3</text><text x="170" y="320">1</text><text x="230" y="320">4</text><text x="290" y="320" font-weight="700">9</text>
  </g>
  <g fill="none" stroke-width="2.5">
    <circle cx="170" cy="192" r="22" stroke="#2563eb"/><circle cx="290" cy="192" r="22" stroke="#d97706"/>
    <circle cx="110" cy="252" r="22" stroke="#059669"/><circle cx="290" cy="312" r="22" stroke="#9333ea"/>
  </g>

  <g stroke="#334155" stroke-width="2">
    <rect x="650" y="145" width="80" height="80" rx="8" fill="#dbeafe"/>
    <rect x="730" y="145" width="80" height="80" rx="8" fill="#ffedd5"/>
    <rect x="650" y="225" width="80" height="80" rx="8" fill="#d1fae5"/>
    <rect x="730" y="225" width="80" height="80" rx="8" fill="#f3e8ff"/>
  </g>
  <g fill="#172554" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="690" y="196">6</text><text x="770" y="196">2</text><text x="690" y="276">5</text><text x="770" y="276">9</text>
  </g>

  <rect x="90" y="365" width="740" height="28" rx="14" fill="#e2e8f0"/>
  <text x="460" y="385" fill="#334155" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Stride 2: move each 2 × 2 window two cells, so the windows do not overlap.</text>
</svg>
