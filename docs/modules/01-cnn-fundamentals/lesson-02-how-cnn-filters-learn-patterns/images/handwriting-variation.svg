<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Different handwriting can represent the same digit</title>
  <desc id="desc">Two differently shaped handwritten sevens have the same digit label, illustrating why training examples should vary.</desc>
  <rect width="760" height="270" rx="18" fill="#f8fafc"/>
  <text x="195" y="45" fill="#172554" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Writing style A</text>
  <text x="565" y="45" fill="#172554" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Writing style B</text>
  <rect x="85" y="65" width="220" height="155" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="455" y="65" width="220" height="155" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M133 105Q190 92 260 103L191 192" fill="none" stroke="#111827" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M506 103 618 97 562 139 551 194" fill="none" stroke="#111827" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M335 145H425" stroke="#64748b" stroke-width="3"/>
  <path d="m414 134 13 11-13 11" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="195" y="249" fill="#334155" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">label: 7</text>
  <text x="565" y="249" fill="#334155" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">label: 7</text>
</svg>
