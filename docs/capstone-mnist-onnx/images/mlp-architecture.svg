<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Fully connected MNIST multilayer perceptron</title>
  <desc id="desc">The 784 pixels of a flattened MNIST image connect to 256 hidden units, then 128 hidden units, and finally ten class-score outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53647c"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#17243b}.head{font-size:20px;font-weight:700}.size{font-size:17px;font-weight:700}.hint{font-size:14px;fill:#53647c}.node{stroke:#fff;stroke-width:2}.edge{stroke:#8ca0b8;stroke-width:1.5;opacity:.52}.step{stroke:#53647c;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="360" rx="22" fill="#f7f9fc"/>
  <text x="500" y="38" text-anchor="middle" font-size="25" font-weight="700">A multilayer perceptron connects every layer to the next</text>
  <text class="head" x="105" y="82" text-anchor="middle">Input pixels</text>
  <text class="head" x="345" y="82" text-anchor="middle">Hidden layer 1</text>
  <text class="head" x="585" y="82" text-anchor="middle">Hidden layer 2</text>
  <text class="head" x="835" y="82" text-anchor="middle">Digit scores</text>
  <g class="edge">
    <path d="M120 137L325 119M120 137L325 153M120 137L325 187M120 137L325 221M120 171L325 119M120 171L325 153M120 171L325 187M120 171L325 221M120 205L325 119M120 205L325 153M120 205L325 187M120 205L325 221M120 239L325 119M120 239L325 153M120 239L325 187M120 239L325 221"/>
    <path d="M365 119L565 137M365 119L565 171M365 119L565 205M365 119L565 239M365 153L565 137M365 153L565 171M365 153L565 205M365 153L565 239M365 187L565 137M365 187L565 171M365 187L565 205M365 187L565 239M365 221L565 137M365 221L565 171M365 221L565 205M365 221L565 239"/>
    <path d="M605 137L810 119M605 137L810 153M605 137L810 187M605 137L810 221M605 171L810 119M605 171L810 153M605 171L810 187M605 171L810 221M605 205L810 119M605 205L810 153M605 205L810 187M605 205L810 221M605 239L810 119M605 239L810 153M605 239L810 187M605 239L810 221"/>
  </g>
  <g fill="#2878b5">
    <circle class="node" cx="120" cy="137" r="10"/><circle class="node" cx="120" cy="171" r="10"/><circle class="node" cx="120" cy="205" r="10"/><circle class="node" cx="120" cy="239" r="10"/>
  </g>
  <g fill="#27a27a">
    <circle class="node" cx="345" cy="119" r="11"/><circle class="node" cx="345" cy="153" r="11"/><circle class="node" cx="345" cy="187" r="11"/><circle class="node" cx="345" cy="221" r="11"/>
  </g>
  <g fill="#7553bc">
    <circle class="node" cx="585" cy="137" r="11"/><circle class="node" cx="585" cy="171" r="11"/><circle class="node" cx="585" cy="205" r="11"/><circle class="node" cx="585" cy="239" r="11"/>
  </g>
  <g fill="#e47638">
    <circle class="node" cx="835" cy="119" r="10"/><circle class="node" cx="835" cy="153" r="10"/><circle class="node" cx="835" cy="187" r="10"/><circle class="node" cx="835" cy="221" r="10"/>
  </g>
  <text class="size" x="105" y="282" text-anchor="middle">784 values</text><text class="hint" x="105" y="305" text-anchor="middle">flattened 28 × 28</text>
  <text class="size" x="345" y="282" text-anchor="middle">256 units</text><text class="hint" x="345" y="305" text-anchor="middle">ReLU + dropout</text>
  <text class="size" x="585" y="282" text-anchor="middle">128 units</text><text class="hint" x="585" y="305" text-anchor="middle">ReLU</text>
  <text class="size" x="835" y="282" text-anchor="middle">10 scores</text><text class="hint" x="835" y="305" text-anchor="middle">digits 0 through 9</text>
</svg>
