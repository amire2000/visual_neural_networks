<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Preprocessing and postprocessing for MNIST ONNX inference</title>
  <desc id="desc">A grayscale test image is converted to a float tensor and batched. Its NumPy values are passed to an ONNX Runtime session, which returns ten logits. Argmax selects the digit, softmax provides a displayed score, and the true label is used only for evaluation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52627a"/></marker></defs>
  <rect width="1120" height="360" rx="18" fill="#f5f8fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172b4d">
    <text x="560" y="35" font-size="21" font-weight="bold">Inference has preparation, model execution, and result handling</text>
    <g><rect x="30" y="82" width="155" height="104" rx="14" fill="#fff" stroke="#91a7c4" stroke-width="2"/><text x="107" y="112" font-size="17" font-weight="bold">MNIST test image</text><text x="107" y="143" font-size="14">28 × 28 grayscale</text><text x="107" y="166" font-size="13">pixel values 0–255</text></g>
    <g><rect x="220" y="82" width="175" height="104" rx="14" fill="#e7f2ff" stroke="#6092c6" stroke-width="2"/><text x="307" y="112" font-size="17" font-weight="bold">Preprocess</text><text x="307" y="143" font-size="14">ToTensor → float32</text><text x="307" y="166" font-size="13">[16, 1, 28, 28], values 0–1</text></g>
    <g><rect x="430" y="82" width="190" height="104" rx="14" fill="#f3ebff" stroke="#9874c2" stroke-width="2"/><text x="525" y="112" font-size="17" font-weight="bold">ONNX Runtime</text><text x="525" y="143" font-size="14">named input: images</text><text x="525" y="166" font-size="13">model graph includes flatten + MLP</text></g>
    <g><rect x="655" y="82" width="150" height="104" rx="14" fill="#fff3dc" stroke="#c89542" stroke-width="2"/><text x="730" y="112" font-size="17" font-weight="bold">10 logits</text><text x="730" y="143" font-size="14">one score per digit</text><text x="730" y="166" font-size="13">shape [16, 10]</text></g>
    <g><rect x="840" y="82" width="245" height="104" rx="14" fill="#e9f8f2" stroke="#5aa68a" stroke-width="2"/><text x="962" y="112" font-size="17" font-weight="bold">Postprocess</text><text x="962" y="143" font-size="14">argmax → predicted digit</text><text x="962" y="166" font-size="13">softmax → displayed score</text></g>
    <path d="M185 134H213 M395 134H423 M620 134H648 M805 134H833" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M107 186V252H224" fill="none" stroke="#8b5e3c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <g><rect x="235" y="230" width="240" height="76" rx="12" fill="#fff8e8" stroke="#d6a74f" stroke-width="2"/><text x="355" y="260" font-size="16" font-weight="bold">True label (target)</text><text x="355" y="285" font-size="13">used after inference for accuracy/title only</text></g>
    <path d="M475 268H625" stroke="#52627a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g><rect x="635" y="230" width="190" height="76" rx="12" fill="#fff" stroke="#91a7c4" stroke-width="2"/><text x="730" y="260" font-size="16" font-weight="bold">Compare</text><text x="730" y="285" font-size="13">predicted digit vs true label</text></g>
    <path d="M825 268H860" stroke="#52627a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g><rect x="870" y="230" width="215" height="76" rx="12" fill="#fff" stroke="#91a7c4" stroke-width="2"/><text x="977" y="260" font-size="16" font-weight="bold">Prediction PNG</text><text x="977" y="285" font-size="13">digit, score, correct / incorrect</text></g>
    <text x="560" y="337" font-size="13" fill="#52627a">The true label never enters the ONNX model input.</text>
  </g>
</svg>
